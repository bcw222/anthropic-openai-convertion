services:
  anthropic-openai:
    build: .
    image: ghcr.io/gsmainagent/anthropic-openai-convertion:latest
    container_name: anthropic-openai-convertion
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      # Upstream root, no /v1 suffix. Examples:
      #   https://api.anthropic.com
      #   https://opencode.ai/inference/anthropic
      ANTHROPIC_BASE_URL: "${ANTHROPIC_BASE_URL:-https://api.anthropic.com}"
      ANTHROPIC_MODELS_URL: "${ANTHROPIC_MODELS_URL:-}"
      ANTHROPIC_AUTH_STYLE: "${ANTHROPIC_AUTH_STYLE:-x-api-key}"
      ANTHROPIC_VERSION: "${ANTHROPIC_VERSION:-2023-06-01}"
      DEFAULT_MAX_TOKENS: "${DEFAULT_MAX_TOKENS:-4096}"
      DEFAULT_MODEL: "${DEFAULT_MODEL:-}"
